services:
  - type: web
    name: seatlock-school
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:react
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SEATLOCK_HOSTED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: seatlock-school-db
          property: connectionString

databases:
  - name: seatlock-school-db
    plan: free
    ipAllowList: []
